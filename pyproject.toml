[project]
name = "farhan-shot"
version = "2.0.0"
description = "Modern WPS WiFi Penetration Testing Tool - Pixie Dust, PIN Prediction, Online/Offline Bruteforce"
authors = [
    {name = "FARHAN Security Research", email = "farhan@example.com"}
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "typer>=0.12.0",
    "wpspin>=0.2.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
farhan-shot = "wps_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wps_tool"]
