[project]
name = "farhan-shot"
version = "2.0.0"
description = "Modern WPS WiFi Penetration Testing Tool - Pixie Dust, PIN Prediction, Online/Offline Bruteforce"
authors = ["FARHAN Security Research"]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7.0",
    "typer>=0.12.0",
    "wpspin>=0.2.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
farhan-shot = "wps_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
